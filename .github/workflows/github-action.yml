name: Atomic Code Deploy

on:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Building project
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: deploy
    name: Deploy to production
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{secrets.SSH_PRIVATE_KEY}}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{secrets.SSH_ADDRESS}} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_rsa ${{secrets.SSH_USER}}@${{secrets.SSH_ADDRESS}} "
            cd /var/www/atomic-tech-frontend &&
            docker stop atomic-tech-frontend || true &&
            docker rm atomic-tech-frontend || true &&
            git pull origin dev &&
            echo \"NEXT_PUBLIC_BASE_URL=${{secrets.NEXT_PUBLIC_BASE_URL}}\" > .env &&
            echo \"NEXT_PUBLIC_API_BASE_URL=${{secrets.NEXT_PUBLIC_API_BASE_URL}}\" >> .env &&
            echo \"NEXT_PUBLIC_GRAFANA_FARO_API_KEY=${{secrets.NEXT_PUBLIC_GRAFANA_FARO_API_KEY}}\" >> .env &&
            echo \"NEXT_PUBLIC_KEYCLOAK_SERVER_URL=${{secrets.NEXT_PUBLIC_KEYCLOAK_SERVER_URL}}\" >> .env &&
            echo \"NEXT_PUBLIC_KEYCLOAK_REALM=${{secrets.NEXT_PUBLIC_KEYCLOAK_REALM}}\" >> .env &&
            echo \"NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${{secrets.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID}}\" >> .env &&
            echo \"NEXT_PUBLIC_KEYCLOAK_CLIENT_SECRET=${{secrets.NEXT_PUBLIC_KEYCLOAK_CLIENT_SECRET}}\" >> .env &&
            docker build -t atomic-tech-frontend . &&
            docker run -d -p 3000:3000 --name atomic-tech-frontend atomic-tech-frontend
          "
